name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT: 4.6.3-stable

jobs:
  build:
    name: 그림·소리·지도 재생성 확인 + 규칙 테스트 + 웹 빌드
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pillow==12.3.0
      - name: 코드로 만든 그림·소리·지도가 저장소와 같은지
        run: |
          python3 tools/art/gen.py
          python3 tools/sound/gen.py
          python3 tools/maps/gen.py > /dev/null
          git status --porcelain
          git diff --stat --exit-code -- data
      - name: Godot 받기
        uses: actions/cache@v4
        id: cache
        with:
          path: ~/godot
          key: godot-${{ env.GODOT }}-web
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o g.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT}/Godot_v${GODOT}_linux.x86_64.zip"
          unzip -q g.zip && rm g.zip
          curl -fsSL -o t.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT}/Godot_v${GODOT}_export_templates.tpz"
          unzip -q t.tpz 'templates/web_nothreads_*' 'templates/version.txt' && rm t.tpz
      - name: 설치
        run: |
          sudo ln -sf ~/godot/Godot_v${GODOT}_linux.x86_64 /usr/local/bin/godot
          V=$(cat ~/godot/templates/version.txt)
          mkdir -p ~/.local/share/godot/export_templates/$V
          cp ~/godot/templates/* ~/.local/share/godot/export_templates/$V/
          godot --headless --version
      - name: 가져오기(import)
        run: timeout 300 godot --headless --import || true
      - name: 규칙·지도 테스트
        run: godot --headless -s tests/run_tests.gd
      - name: 게임이 오류 없이 켜지는지
        run: |
          timeout 60 godot --headless --audio-driver Dummy --quit-after 300 2>&1 | tee run.log
          ! grep -E "SCRIPT ERROR|Parse Error" run.log
      - name: 웹으로 내보내기
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          ls -la build/web
          test -s build/web/index.pck
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: build/web

  deploy:
    name: GitHub Pages에 올리기
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
